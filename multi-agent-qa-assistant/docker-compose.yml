services:
  # Owns the SQL database and the biomedical vector store. Exposes them
  # as MCP tools (what the backend actually uses) and as plain REST
  # endpoints under /tools/... (an additional, direct access point --
  # see mcp_layer/mcp_server.py).
  mcp-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp-server
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Pre-built Chroma store, generated by ingest_biomedical_corpus.py --
      # mounted rather than baked into the image (it's data, and rebuilding
      # the image shouldn't require re-ingesting the corpus). Needs to be
      # writable: chromadb.PersistentClient manages its own locking/WAL
      # files even for read-only querying, so a :ro mount fails to open it.
      - ./chroma_db:/app/chroma_db

  # The LangGraph multi-agent orchestration (guardrail -> supervisor ->
  # sql/rag/both/off_topic -> aggregate) plus the MCP client that reaches
  # mcp-server, all wrapped as a FastAPI service (backend_api.py). This
  # is the only piece that needs the LLM/Langfuse credentials in .env.
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: .env
    ports:
      - "8001:8001"
    environment:
      # Talk to the mcp-server container by its Compose service name, not
      # localhost -- Compose puts every service in this file on one
      # network and resolves "mcp-server" to that container's address.
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
    depends_on:
      - mcp-server

  # The Streamlit chat UI (app.py). Holds no agent logic and no secrets --
  # its only job is rendering the chat and calling the backend over HTTP.
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      # Same idea as MCP_SERVER_URL above: reach the backend by its
      # Compose service name, not localhost.
      - BACKEND_URL=http://backend:8001
    depends_on:
      - backend
